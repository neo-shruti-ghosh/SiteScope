services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitescope
      POSTGRES_PASSWORD: sitescope
      POSTGRES_DB: sitescope
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitescope"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
